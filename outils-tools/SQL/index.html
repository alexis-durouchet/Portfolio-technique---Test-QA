
<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- ==================================================
         1. CONFIGURATION DE LA PAGE
         ================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Démonstration de tests QA SQL sur une base de données e-commerce fictive : structure, extraction de données et contrôles d'intégrité.">

    <title>SQL — Démonstration QA</title>

    <!-- Feuille de style -->
    <link rel="stylesheet" href="index.css">

     <!-- ==================================================
         2. FICHIERS JAVASCRIPT
         ==================================================

         traductions.js :
         Contient les textes français et anglais.

         index.js :
         Gère la navigation, les scénarios QA,
         les captures et le changement de langue.

         Les deux fichiers sont nécessaires au
         fonctionnement de la démonstration.

         IMPORTANT :
         Charger traductions.js AVANT index.js.
         ================================================== -->

</head>

<body>

    <!-- ==================================================
         3. EN-TÊTE ET SÉLECTEUR DE LANGUE
         ================================================== -->

    <header>
        <div class="entete">

            <!-- Sélection Français / English -->
            <div class="langues"
                 role="group"
                 aria-label="Language / Langue">

                <button type="button"
                        id="bouton-fr"
                        class="actif"
                        aria-pressed="true"
                        lang="fr">
                    FR
                </button>

                <button type="button"
                        id="bouton-en"
                        aria-pressed="false"
                        lang="en">
                    EN
                </button>

            </div>

            <!-- Présentation de la démonstration -->
            <h1 id="titre-site">
                SQL — Démonstration QA
            </h1>

            <p id="sous-titre">
                Projet pédagogique · QA_Ecommerce_Demo · SQL Server
            </p>

        </div>
    </header>

    <!-- ==================================================
         4. CONTENU PRINCIPAL
         ================================================== -->

    <main>

        <!-- ==================================================
             5. NAVIGATION ENTRE LES TROIS MODULES
             ================================================== -->

        <nav id="navigation-modules"
             aria-label="Modules de la démonstration SQL">

            <button type="button"
                    data-module="STRUCTURE"
                    class="actif"
                    aria-pressed="true">

                01 — Structure de la base

            </button>

            <button type="button"
                    data-module="EXTRACTION"
                    aria-pressed="false">

                02 — Extraction et contrôle

            </button>

            <button type="button"
                    data-module="INTEGRITE"
                    aria-pressed="false">

                03 — Tests d'intégrité

            </button>

        </nav>

        <!-- ==================================================
             6. NAVIGATION DES CAS D'USAGE
             ================================================== -->

        <!--
             Cette navigation sera alimentée par index.js.

             MODULE STRUCTURE :
             Aucun cas d'usage à sélectionner.

             MODULE EXTRACTION :
             EXT-01 à EXT-05.

             MODULE INTÉGRITÉ :
             INT-01 à INT-04.
        -->

        <nav id="navigation-tests"
             aria-label="Cas d'usage du module sélectionné"
             hidden>
        </nav>

        <!-- ==================================================
             7. AFFICHAGE DU CONTENU
             ================================================== -->

        <!--
             Cette section sera alimentée dynamiquement
             par index.js.

             STRUCTURE :
             - Présentation de la base de données
             - Description des cinq tables
             - Diagramme relationnel Arbo-diag.png
             - Accès aux huit scripts SQL

             EXTRACTION :
             - Présentation des contrôles QA
             - Sélection des scénarios EXT-01 à EXT-05
             - Objectifs et résultats attendus
             - Captures SSMS correspondantes
             - Accès au script SQL complet

             INTÉGRITÉ :
             - Présentation des tests négatifs
             - Sélection des scénarios INT-01 à INT-04
             - Contraintes vérifiées
             - Résultats attendus et obtenus
             - Captures SSMS correspondantes
             - Accès au script SQL complet
        -->

        <section id="contenu"
                 class="carte"
                 aria-live="polite"
                 aria-label="Contenu de la démonstration SQL">

            <!--
                 Contenu généré par JavaScript.
            -->

        </section>

    </main>

    <!-- ==================================================
         8. PIED DE PAGE
         ================================================== -->

    <footer id="pied-page">

        Portfolio QA — Démonstration SQL ·
        Base de données fictive QA_Ecommerce_Demo

    </footer>

</body>

</html>
