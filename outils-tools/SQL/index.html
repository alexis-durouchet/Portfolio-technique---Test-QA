<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- ==================================================
         1. CONFIGURATION DE LA PAGE
         ================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Démonstration de tests QA SQL sur une base de données e-commerce fictive : structure, extraction de données et contrôles d'intégrité.">

    <title>SQL — Démonstration QA</title>

    <!-- Feuille de style -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- ==================================================
         3. EN-TÊTE ET SÉLECTEUR DE LANGUE
         ================================================== -->

    <header>
        <div class="entete">

            <!-- Sélection Français / English -->
            <div class="langues"
                 role="group"
                 aria-label="Language / Langue">

                <button type="button"
                        id="bouton-fr"
                        class="actif"
                        aria-pressed="true"
                        lang="fr">
                    FR
                </button>

                <button type="button"
                        id="bouton-en"
                        aria-pressed="false"
                        lang="en">
                    EN
                </button>

            </div>

            <!-- Présentation de la démonstration -->
            <h1 id="titre-site">
                SQL — Démonstration QA
            </h1>

            <p id="sous-titre">
                Projet pédagogique · QA_Ecommerce_Demo · SQL Server
            </p>

        </div>
    </header>

    <!-- ==================================================
         4. CONTENU PRINCIPAL
         ================================================== -->

    <main>

        <!-- ==================================================
             5. NAVIGATION ENTRE LES TROIS MODULES
             ================================================== -->

        <nav id="navigation-modules"
             aria-label="Modules de la démonstration SQL">

            <button type="button"
                    data-module="STRUCTURE"
                    class="actif"
                    aria-pressed="true">
                01 — Structure de la base
            </button>

            <button type="button"
                    data-module="EXTRACTION"
                    aria-pressed="false">
                02 — Extraction et contrôle
            </button>

            <button type="button"
                    data-module="INTEGRITE"
                    aria-pressed="false">
                03 — Tests d'intégrité
            </button>

        </nav>

        <!-- ==================================================
             6. NAVIGATION DES CAS D'USAGE
             ================================================== -->

        <nav id="navigation-tests"
             aria-label="Cas d'usage du module sélectionné"
             hidden>
        </nav>

        <!-- ==================================================
             7. AFFICHAGE DU CONTENU
             ================================================== -->

        <section id="contenu"
                 class="carte"
                 aria-live="polite"
                 aria-label="Contenu de la démonstration SQL">
            <!-- Contenu généré dynamiquement par index.js -->
        </section>

    </main>

    <!-- ==================================================
         8. PIED DE PAGE
         ================================================== -->

    <footer id="pied-page">
        Portfolio QA — Démonstration SQL · Base de données fictive QA_Ecommerce_Demo
    </footer>

    <!-- ==================================================
         2. FICHIERS JAVASCRIPT
         ==================================================
         Chargement de traductions.js AVANT index.js
         ================================================== -->
    <script src="traductions.js"></script>
    <script src="index.js"></script>

</body>

</html>
