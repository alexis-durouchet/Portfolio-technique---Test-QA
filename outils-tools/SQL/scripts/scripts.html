
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consultation des scripts SQL du projet QA E-commerce.">
    <title>Scripts SQL | Portfolio QA</title>

    <link rel="stylesheet" href="scripts.css">
    <script src="scripts-traductions.js" defer></script>
    <script src="scripts.js" defer></script>
</head>

<body>
    <header class="entete">

        <!-- Sélection de la langue -->
        <nav class="langues"
             aria-label="Choix de la langue"
             data-i18n-aria-label="choixLangue">

            <button type="button"
                    data-lang="fr"
                    lang="fr"
                    aria-pressed="true">
                Français
            </button>

            <button type="button"
                    data-lang="en"
                    lang="en"
                    aria-pressed="false">
                English
            </button>
        </nav>

        <!-- Présentation -->
        <div class="entete-texte">
            <h1 data-i18n="titre">
                Scripts SQL — Projet QA E-commerce
            </h1>

            <p data-i18n="description">
                Consultez les huit scripts de création, de manipulation et de vérification de la base de données.
            </p>
        </div>

        <!-- Navigation de retour -->
        <nav class="liens-retour"
             aria-label="Navigation de retour"
             data-i18n-aria-label="navigationRetour">

            <a href="../../../../index.html"
               data-i18n="retourPortfolio">
                Retour au portfolio
            </a>

            <a href="https://github.com/alexis-durouchet/Portfolio-technique---Test-QA/tree/main/outils-tools/SQL/scripts"
               target="_blank"
               rel="noopener noreferrer"
               data-i18n="voirGithub">
                Voir sur GitHub
            </a>
        </nav>
    </header>

    <main class="conteneur">

        <!-- Liste des scripts -->
        <nav class="menu-scripts"
             aria-label="Liste des scripts SQL"
             data-i18n-aria-label="navigationScripts">

            <h2 data-i18n="listeScripts">
                Liste des scripts
            </h2>

            <div id="liste-scripts"></div>
        </nav>

        <!-- Affichage du code SQL -->
        <section class="lecture-script"
                 aria-labelledby="titre-script">

            <h2 id="titre-script"
                data-i18n="selectionScript">
                Sélectionnez un script
            </h2>

            <p id="nom-fichier"
               class="nom-fichier"></p>

            <pre class="zone-code"><code id="contenu-script"
                  aria-live="polite"
                  data-i18n="instruction">Choisissez un script dans la liste de gauche pour afficher son contenu.</code></pre>
        </section>
    </main>
</body>
</html>
