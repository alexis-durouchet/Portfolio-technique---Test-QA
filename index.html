<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Configuration de la page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Portfolio technique d'Alexis Durouchet : parcours, compétences et outils de test logiciel.">

    <title>Alexis Durouchet | Portfolio technique - Test & QA</title>

    <!-- Feuille de style -->
    <link rel="stylesheet" href="css/index.css">

    <!-- Script principal -->
    <script src="js/index.js" defer></script>
</head>

<body>

    <!-- Contenu principal -->
    <main id="accueil">

        <!-- Bloc : Profil -->
        <section id="profil">
            <h1>Profil</h1>

            <div class="contenu-bloc">
                <!-- Présentation, parcours, objectifs et formation -->
            </div>
        </section>

        <!-- Bloc : Langages -->
        <section id="langages">
            <h2>Langages</h2>

            <div class="contenu-bloc">
                <!-- Liste des langages de programmation -->
            </div>
        </section>

        <!-- Bloc : Outils -->
        <section id="outils">
            <h2>Outils</h2>

            <div class="contenu-bloc">
                <!-- Liste des outils et logiciels -->
            </div>
        </section>

        <!-- Bloc : Méthodologie -->
        <section id="methodologie">
            <h2>Méthodologie</h2>

            <div class="contenu-bloc">
                <!-- Méthodes et pratiques de test logiciel -->
            </div>
        </section>

        <!-- Bloc : Contact -->
        <section id="contact">
            <h2>Contact</h2>

            <div class="contenu-bloc">
                <!-- Coordonnées et liens professionnels -->
            </div>
        </section>

    </main>

</body>
</html>
